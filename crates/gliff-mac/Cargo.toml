#= gliff-mac — native macOS client for gliff (views a remote Hyprland session).
#= Version history lives in crates/gliff-mac/CHANGELOG.md.
[package]
name = "gliff-mac"
version = "0.1.0"
description = "macOS client for gliff: view and drive a remote Hyprland session over ssh"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
#= The binary keeps the upstream name scheme so `gliff-mac user@host` reads
#= like `gliff user@host`.
name = "gliff-mac"
path = "src/main.rs"

[dependencies]
#= Portable gliff crates: wire protocol, framing/ssh, CPU (OpenH264) codec.
gliff-proto.workspace = true
gliff-transport.workspace = true
gliff-sw.workspace = true

anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
bytes.workspace = true
png.workspace = true
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
#= AppKit through the objc2 bindings. The 0.3 framework crates enable every
#= framework feature by default, so no feature list is pinned here.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
