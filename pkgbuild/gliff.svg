<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Gliff</title>
  <desc>A computer screen on a stand seen from the front, with a pointer on it, each piece with a hard shadow.</desc>
  <g transform="translate(256 256) scale(1.2) translate(-256 -256)">
    <!-- The stand. -->
    <rect x="236" y="330" width="40" height="64" fill="#0e0e14" transform="translate(0 6)"/>
    <rect x="236" y="330" width="40" height="64" fill="#c0caf5"/>
    <rect x="164" y="382" width="184" height="28" rx="14" fill="#0e0e14" transform="translate(0 8)"/>
    <rect x="164" y="382" width="184" height="28" rx="14" fill="#c0caf5"/>
    <!-- The screen; one hard shadow, as Hype's slides. -->
    <rect x="76" y="96" width="360" height="248" rx="22" fill="#0e0e14" transform="translate(0 8)"/>
    <rect x="76" y="96" width="360" height="248" rx="22" fill="#c0caf5"/>
    <!-- The pointer driving it from another machine, dark on the screen as in
         Gliff's own icon. -->
    <path d="M222 140V286L258 252L284 306L316 291L290 238H340Z" fill="#0e0e14" stroke="#0e0e14" stroke-width="16" stroke-linejoin="round"/>
  </g>
</svg>
