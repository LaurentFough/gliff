<!doctype html>
<!-- machine-menu.html v1.1.0 — a close macOS approximation of Gliff's
     Machine menu (crates/gliff-macos/native/Gliff.swift, App menu setup),
     rendered to PNG by render.py at @2x. Items and order match the code. -->
<html><head><meta charset="utf-8">
<style>
  :root { --hl: #FF3B30; }  /* macOS systemRed */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 760px; height: 400px; overflow: hidden;
    font: 13px/1 "Inter", -apple-system, sans-serif; letter-spacing: -0.08px;
    /* neutral desktop, no wallpaper art */
    background: radial-gradient(120% 140% at 15% 0%, #5b6fd8 0%, #3a3f9e 38%, #1f2350 75%, #151735 100%);
    -webkit-font-smoothing: antialiased;
  }
  .bar {
    height: 24px; display: flex; align-items: center; padding: 0 10px;
    background: rgba(246,246,248,0.78); backdrop-filter: blur(30px);
    box-shadow: 0 0.5px 0 rgba(0,0,0,0.18); color: #1d1d1f;
  }
  .bar span { padding: 3px 9px; border-radius: 5px; }
  .bar .app { font-weight: 700; }
  .bar .open { background: rgba(0,0,0,0.12); }
  .bar .right { margin-left: auto; font-variant-numeric: tabular-nums; }
  /* the window behind, so the menu reads as over a Gliff session */
  .win {
    position: absolute; left: 380px; top: 60px; width: 470px; height: 380px;
    border-radius: 10px; background: #fff; box-shadow: 0 20px 50px rgba(0,0,0,.45), 0 0 0 .5px rgba(0,0,0,.3);
    overflow: hidden;
  }
  .win .title { height: 28px; display: flex; align-items: center; gap: 8px; padding-left: 12px;
    font-weight: 600; color: #4d4d4d; font-size: 13px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .win .screen { position: absolute; top: 28px; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, #2b2f6b 0%, #c98a3e 55%, #3f4c86 100%); }
  .menu {
    position: absolute; left: 117px; top: 27px; width: 214px; padding: 5px;
    background: rgba(242,242,244,0.86); backdrop-filter: blur(40px) saturate(1.6);
    border-radius: 9px;
    box-shadow: 0 0 0 0.5px rgba(0,0,0,0.22), 0 10px 32px rgba(0,0,0,0.32), inset 0 0 0 0.5px rgba(255,255,255,0.6);
  }
  .item { position: relative; height: 22px; display: flex; align-items: center;
    padding-left: 22px; border-radius: 5px; color: #1d1d1f; }
  .item .check { position: absolute; left: 7px; font-size: 11px; font-weight: 700; top: 5px; }
  .sep { height: 1px; margin: 5px 9px; background: rgba(0,0,0,0.11); }
  /* feature outline: 2 pt systemRed, as in the redacted screenshots */
  .hl { position: absolute; border: 2px solid var(--hl); border-radius: 7px; pointer-events: none; }
</style></head>
<body>
  <div class="bar">
    <span class="app">Gliff</span><span>File</span><span class="open">Machine</span><span>Window</span>
    <span class="right">Fri 30 Oct  14:40</span>
  </div>

  <div class="win">
    <div class="title"><i class="dot" style="background:#ff5f57"></i><i class="dot" style="background:#febc2e"></i><i class="dot" style="background:#28c840"></i>
      <span style="margin-left:6px">Gliff — user@host-d</span></div>
    <div class="screen"></div>
  </div>

  <div class="menu" id="menu">
    <div class="item"><span class="check">✓</span>Mirror Screen</div>
    <div class="item">Private Screen</div>
    <div class="sep"></div>
    <div class="item"><span class="check">✓</span>Share Clipboard</div>
    <div class="item" id="sound"><span class="check">✓</span>Play Sound</div>
    <div class="sep"></div>
    <div class="item" id="rc1">Reconnect</div>
    <div class="item" id="rc2"><span class="check">✓</span>Reconnect Automatically</div>
  </div>

  <script>
    //= Draw the outlines from the items' real boxes so they stay aligned.
    function box(ids, pad) {
      const rs = ids.map(id => document.getElementById(id).getBoundingClientRect());
      const d = document.createElement('div'); d.className = 'hl';
      const l = Math.min(...rs.map(r => r.left)) - pad, t = Math.min(...rs.map(r => r.top)) - pad;
      const r = Math.max(...rs.map(r => r.right)) + pad, b = Math.max(...rs.map(r => r.bottom)) + pad;
      Object.assign(d.style, { left: l + 'px', top: t + 'px', width: (r - l) + 'px', height: (b - t) + 'px' });
      document.body.appendChild(d);
    }
    box(['sound'], 1);
    box(['rc1', 'rc2'], 1);
  </script>
</body></html>
