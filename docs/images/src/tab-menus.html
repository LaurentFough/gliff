<!doctype html>
<!-- tab-menus.html v1.0.0 — the viewer's File and Window menus with the tab
     commands (App menu setup in native/Gliff.swift), both drawn open for the
     picture; macOS shows one at a time. Outlined: the tab commands.
     Render: render.py tab-menus.html ../macos-tab-menus.png 760 330 -->
<html><head><meta charset="utf-8">
<style>
  :root { --hl: #FF3B30; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 760px; height: 330px; overflow: hidden; font: 13px/1 "Inter", -apple-system, sans-serif;
         background: radial-gradient(120% 140% at 15% 0%, #5b6fd8 0%, #3a3f9e 38%, #1f2350 75%, #151735 100%);
         -webkit-font-smoothing: antialiased; }
  .bar { height: 24px; display: flex; align-items: center; padding: 0 10px; background: rgba(246,246,248,0.78);
         box-shadow: 0 0.5px 0 rgba(0,0,0,0.18); color: #1d1d1f; }
  .bar span { padding: 3px 9px; border-radius: 5px; }
  .bar .app { font-weight: 700; }
  .bar .open { background: rgba(0,0,0,0.12); }
  .menu { position: absolute; top: 27px; padding: 5px; background: rgba(242,242,244,0.92);
          border-radius: 9px; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.22), 0 10px 32px rgba(0,0,0,0.32); }
  .item { height: 22px; display: flex; align-items: center; padding: 0 10px 0 22px; border-radius: 5px; color: #1d1d1f; gap: 30px; }
  .item .k { margin-left: auto; color: #6e6e73; }
  .sep { height: 1px; margin: 5px 9px; background: rgba(0,0,0,0.11); }
  .hl { position: absolute; border: 2px solid var(--hl); border-radius: 7px; pointer-events: none; }
</style></head>
<body>
  <div class="bar"><span class="app">Gliff</span><span class="open" id="fileTitle">File</span><span>Edit</span><span>Machine</span><span class="open" id="winTitle">Window</span></div>
  <div class="menu" id="file" style="left:58px;width:190px">
    <div class="item" data-hl="file">New Tab<span class="k">⌘T</span></div>
    <div class="item" data-hl="file">Close Tab<span class="k">⌘W</span></div>
  </div>
  <div class="menu" id="window" style="left:262px;width:280px">
    <div class="item">Minimize<span class="k">⌘M</span></div>
    <div class="sep"></div>
    <div class="item" data-hl="tabs">Show Previous Tab<span class="k">⇧⌘[</span></div>
    <div class="item" data-hl="tabs">Show Next Tab<span class="k">⇧⌘]</span></div>
    <div class="item" data-hl="tabs">Move Tab to New Window</div>
    <div class="item" data-hl="tabs">Merge All Windows</div>
    <div class="item" data-hl="tabs">Show Tab Bar</div>
    <div class="sep"></div>
    <div class="item">✓&nbsp; Gliff — user@host-a</div>
    <div class="item">Gliff — user@host-b</div>
  </div>
  <script>
    //= Outlines from the items' real boxes (as outline.js, padded 1).
    const groups = {};
    document.querySelectorAll('[data-hl]').forEach(el => (groups[el.dataset.hl] = groups[el.dataset.hl] || []).push(el.getBoundingClientRect()));
    Object.values(groups).forEach(rs => {
      const l = Math.min(...rs.map(r => r.left)) - 1, t = Math.min(...rs.map(r => r.top)) - 1;
      const r = Math.max(...rs.map(r => r.right)) + 1, b = Math.max(...rs.map(r => r.bottom)) + 1;
      const d = document.createElement('div'); d.className = 'hl';
      Object.assign(d.style, { left: l + 'px', top: t + 'px', width: (r - l) + 'px', height: (b - t) + 'px' });
      document.body.appendChild(d);
    });
  </script>
</body></html>
