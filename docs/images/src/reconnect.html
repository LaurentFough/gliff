<!doctype html>
<!-- reconnect.html v1.0.0 — a viewer tab whose session dropped and waits:
     the message RemoteView draws (white on black, from the middle) and the
     Reconnect button under it, as client.rs shows after the automatic
     retries (or with Reconnect Automatically off).
     Render: render.py reconnect.html ../macos-reconnect.png 760 420 -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="window.css">
<style>
  .titlebar { background: #ececec; border-bottom: .5px solid rgba(0,0,0,.15); }
  .sub { color: #8e8e93; font-weight: 400; margin-left: 8px; font-size: 12px; }
  .screen { position: absolute; top: 32px; left: 0; right: 0; bottom: 0; background: #000; color: #fff; }
  .msg { position: absolute; left: 24px; top: 194px; font-size: 16px; line-height: 20px; white-space: pre; }
  .rbtn { position: absolute; left: 24px; top: 246px; height: 24px; padding: 0 12px; border-radius: 6px;
          background: #5c5c5e; color: #fff; display: flex; align-items: center; font-size: 13px; }
  .info { position: absolute; right: 12px; top: 8px; color: #8e8e93; font-size: 15px; }
</style></head>
<body><div class="win">
  <div class="titlebar"><i class="dot" style="background:#ff5f57"></i><i class="dot" style="background:#febc2e"></i><i class="dot" style="background:#28c840"></i>
    <span class="t">Gliff — user@host-a</span><span class="sub">Shift+Esc releases keyboard</span><span class="info">ⓘ</span></div>
  <div class="screen">
    <div class="msg">server stopped responding for 20 seconds
Reconnect, or close this window.</div>
    <div class="rbtn" data-hl="reconnect">Reconnect</div>
  </div>
</div>
<script src="outline.js"></script>
</body></html>
